#
# 本地 Pub/Sub Broker 配置
#
server.port=8080

# ACK 超时（毫秒）：消息投递给订阅端后超过该时间仍未确认，触发重投
broker.ack-timeout-ms=10000
# 单条消息最大投递次数（含首次）：达到后不再重投，转入死信
broker.max-deliveries=3
# 单订阅端在途（已投递/待投递但未完成）消息上限
broker.max-pending-per-subscription=100
# 积压达到上限时的策略：
#   dead-letter  -> 保留窗口内在途消息，拒绝新消息并入死信（默认，优先保证窗口内消息）
#   drop-oldest  -> 把最旧在途消息移入死信，腾位置给新消息（优先追上最新流量）
broker.overflow-strategy=dead-letter
# 重投扫描间隔（毫秒）
broker.redelivery-scan-ms=200

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
